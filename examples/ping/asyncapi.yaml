asyncapi: 3.0.0

info:
  title: Ping Bridge
  version: 1.0.0
  description: |
    WebView(React)와 Native(iOS·Android) 사이 브릿지 계약의 **단일 원본**입니다.
    이 파일에서 TypeScript·Swift·Kotlin 타입과 Router 화이트리스트, 이 HTML 문서가 생성됩니다.

    ## 관점
    - `application`은 **WebView(웹)** 입니다.
    - `action: send` + `reply` = `bridge.request` (RPC, Web → Native, 응답 있음)
    - `action: send` = `bridge.emit` (Web → Native 단방향 명령, 응답 없음)
    - `action: receive` = `bridge.on` (Native → Web 푸시 이벤트)

    ## 메시지 종류
    - `rpc_request` : Web → Native. `id`로 응답과 짝을 맞춥니다.
    - `rpc_response` : Native → Web. `result` 또는 `error`(BridgeError)를 담습니다.
    - `event` : 양방향. `bridge.emit`은 `source: web`, `bridge.on`은 `source: native` 입니다.

    ## 이름
    operation 이름은 점(.) 없는 lowerCamelCase 한 단어입니다 (예: `ping`, `getAppInfo`).
    `info.x-bridgegen.reservedNames`에 적은 이름(예: 이전 세대 브릿지의 전역 콜백 이름)과 겹치면 생성기가 실패합니다. `bridge`로 시작하는 이름은 런타임 예약입니다.

    ## 확장 필드
    - `x-kind` : `request` · `emit` · `event` 중 하나입니다.
    - `x-since` : 처음 지원한 앱 버전 (`{ ios, android }`). 없으면 그 플랫폼은 미지원입니다.
    - `x-idempotent` : 여러 번 불러도 결과가 같은 읽기 요청이면 `true`. 자동 재시도는 이 요청만 합니다.
    - `x-timeout-ms` : 요청별 timeout. 없으면 Bridge Core 기본값(10초)입니다.
    - `x-native-errors` : Handler가 돌려줄 수 있는 도메인 오류 코드 (`NATIVE_ERROR`의 `details.code`).

  x-bridgegen:
    npm: { name: '@example/ping-bridge' }
    android: { groupId: com.example, artifactId: ping-bridge, package: com.example.pingbridge }
    swift: { module: PingBridge }

defaultContentType: application/json

servers:
  ios:
    host: webkit.messageHandlers.bridge
    protocol: wkscriptmessage
    description: |
      Web → Native: `webkit.messageHandlers.bridge.postMessage(envelope)`
      Native → Web: `window.__receiveBridgeMessage(envelope)` (`callAsyncJavaScript`의 arguments로 전달)
      Native Router는 메시지마다 `frameInfo.isMainFrame`과 `securityOrigin`을 검사합니다.
  android:
    host: window.bridge
    protocol: web-message-listener
    description: |
      `WebViewCompat.addWebMessageListener(webView, "bridge", allowedOriginRules, listener)`
      Web → Native: `window.bridge.postMessage(JSON.stringify(envelope))`
      Native → Web: `replyProxy.postMessage(json)` → `window.bridge.onmessage` → Bridge Core의 같은 수신 경로
      허용 origin이 아닌 문서에는 `window.bridge`가 생기지 않습니다. `addJavascriptInterface`는 쓰지 않습니다.

channels:
  # ── RPC (bridge.request) : method마다 channel 하나 ─────────────────────
  ping:
    address: ping
    messages:
      request: { $ref: '#/components/messages/ping.request' }
  resetPing:
    address: resetPing
    messages:
      request: { $ref: '#/components/messages/resetPing.request' }

  # ── 단방향 명령 (bridge.emit) ─────────────────────────────────────────
  logPing:
    address: logPing
    messages:
      emit: { $ref: '#/components/messages/logPing' }
  clearPingLog:
    address: clearPingLog
    messages:
      emit: { $ref: '#/components/messages/clearPingLog' }

  # ── 푸시 이벤트 (bridge.on) ───────────────────────────────────────────
  nativePing:
    address: nativePing
    messages:
      event: { $ref: '#/components/messages/nativePing' }
  nativePingStopped:
    address: nativePingStopped
    messages:
      event: { $ref: '#/components/messages/nativePingStopped' }

  # ── 단일 수신 진입점: 모든 rpc_response가 여기로 들어온다 ─────────────────
  receiveBridgeMessage:
    address: window.__receiveBridgeMessage
    description: Native → Web 단일 진입점. RPC 응답은 모두 이 channel로 돌아옵니다.
    messages:
      ping.response: { $ref: '#/components/messages/ping.response' }
      resetPing.response: { $ref: '#/components/messages/resetPing.response' }

# 예시 operation: ping/pong 으로 세 가지 통신 방식을 모두 보여 줍니다.
#   REQUEST  ping → 응답(result)으로 pong을 받는다 · resetPing → params · result가 모두 빈 요청
#   SEND     logPing → Native가 로그만 남긴다 · clearPingLog → payload 없이 보낸다. 둘 다 응답 없음
#   RECEIVE  nativePing · nativePingStopped → 웹이 보낸 것의 답이 아니라 Native가 먼저 알린다
# 응답이 필요하면 REQUEST를 씁니다. SEND를 보내고 RECEIVE로 결과를 받는 짝(요청 id 없는 콜백 방식)은 만들지 않습니다.
operations:
  ping:
    action: send
    summary: ping을 보내고 pong을 응답으로 받는다.
    description: |
      응답이 있는 요청(RPC)의 예시입니다. `message`가 `reject`이면 Handler가 `PING_REJECTED`로 실패합니다.
      결과가 매번 같은 읽기 요청이라 `TIMEOUT` · `SEND_FAILED`에서 자동 재시도할 수 있습니다.
    x-kind: request
    x-since: { ios: 3.3.0, android: 3.3.0 }
    x-idempotent: true
    x-timeout-ms: 3000
    x-native-errors: [PING_REJECTED]
    channel: { $ref: '#/channels/ping' }
    messages: [{ $ref: '#/channels/ping/messages/request' }]
    reply:
      channel: { $ref: '#/channels/receiveBridgeMessage' }
      messages: [{ $ref: '#/channels/receiveBridgeMessage/messages/ping.response' }]

  resetPing:
    action: send
    summary: ping 횟수를 초기화한다. params와 result가 모두 비어 있다.
    x-kind: request
    x-since: { ios: 3.3.0, android: 3.3.0 }
    x-idempotent: false
    channel: { $ref: '#/channels/resetPing' }
    messages: [{ $ref: '#/channels/resetPing/messages/request' }]
    reply:
      channel: { $ref: '#/channels/receiveBridgeMessage' }
      messages: [{ $ref: '#/channels/receiveBridgeMessage/messages/resetPing.response' }]

  logPing:
    action: send
    summary: Native 로그에 ping을 남긴다. 응답이 없다.
    description: 응답이 없는 명령(SEND)의 예시입니다. Native는 일(로그 기록)만 하고 웹에 아무것도 돌려주지 않습니다.
    x-kind: emit
    x-since: { ios: 3.3.0, android: 3.3.0 }
    channel: { $ref: '#/channels/logPing' }
    messages: [{ $ref: '#/channels/logPing/messages/emit' }]

  clearPingLog:
    action: send
    summary: Native의 ping 로그를 지운다. payload와 응답이 모두 없다.
    x-kind: emit
    x-since: { ios: 3.3.0, android: 3.3.0 }
    channel: { $ref: '#/channels/clearPingLog' }
    messages: [{ $ref: '#/channels/clearPingLog/messages/emit' }]

  nativePing:
    action: receive
    summary: 'Native가 먼저 ping을 보낸다 (예: 앱이 foreground로 돌아왔을 때).'
    description: Native가 먼저 보내는 이벤트(RECEIVE)의 예시입니다. 웹이 보낸 요청에 대한 응답이 아닙니다.
    x-kind: event
    x-since: { ios: 3.3.0, android: 3.3.0 }
    channel: { $ref: '#/channels/nativePing' }
    messages: [{ $ref: '#/channels/nativePing/messages/event' }]

  nativePingStopped:
    action: receive
    summary: 'Native가 ping 보내기를 멈췄다 (예: 앱이 background로 갔을 때). payload가 없다.'
    x-kind: event
    x-since: { ios: 3.3.0, android: 3.3.0 }
    channel: { $ref: '#/channels/nativePingStopped' }
    messages: [{ $ref: '#/channels/nativePingStopped/messages/event' }]

components:
  correlationIds:
    rpcId:
      description: rpc_request와 rpc_response를 짝짓는 id
      location: $message.payload#/id

  messages:
    ping.request:
      name: ping.request
      title: rpc_request · ping
      correlationId: { $ref: '#/components/correlationIds/rpcId' }
      payload: { $ref: '#/components/schemas/PingParams' }
    ping.response:
      name: ping.response
      title: rpc_response · ping
      correlationId: { $ref: '#/components/correlationIds/rpcId' }
      payload: { $ref: '#/components/schemas/PongResult' }
    resetPing.request:
      name: resetPing.request
      title: rpc_request · resetPing
      correlationId: { $ref: '#/components/correlationIds/rpcId' }
      payload: { $ref: '#/components/schemas/EmptyPayload' }
    resetPing.response:
      name: resetPing.response
      title: rpc_response · resetPing
      correlationId: { $ref: '#/components/correlationIds/rpcId' }
      payload: { $ref: '#/components/schemas/EmptyPayload' }
    logPing:
      name: logPing
      title: event · logPing
      payload: { $ref: '#/components/schemas/PingParams' }
    clearPingLog:
      name: clearPingLog
      title: event · clearPingLog
      payload: { $ref: '#/components/schemas/EmptyPayload' }
    nativePing:
      name: nativePing
      title: event · nativePing
      payload: { $ref: '#/components/schemas/NativePingPayload' }
    nativePingStopped:
      name: nativePingStopped
      title: event · nativePingStopped
      payload: { $ref: '#/components/schemas/EmptyPayload' }

  schemas:
    # ── envelope: 모든 메시지가 이 세 모양 중 하나로 오간다. 라이브러리 런타임이 쓰며 코드 생성 대상이 아니다. ──
    RpcRequest:
      type: object
      description: Web → Native RPC 요청
      x-codegen-skip: true
      required: [type, id, version, target, method]
      properties:
        type: { const: rpc_request }
        id: { type: string }
        version: { const: 1 }
        target: { const: native }
        method: { type: string, description: 'operation 이름 (예: ping)' }
        params: { description: operation별 params. 없으면 빈 객체로 봅니다. }

    RpcResponse:
      type: object
      description: Native → Web RPC 응답. result와 error 중 하나만 있습니다.
      x-codegen-skip: true
      required: [type, id, version, source, method]
      properties:
        type: { const: rpc_response }
        id: { type: string }
        version: { const: 1 }
        source: { const: native }
        method: { type: string }
        result: { description: operation별 result }
        error: { $ref: '#/components/schemas/BridgeError' }

    EventEnvelope:
      type: object
      description: 양방향 이벤트. bridge.emit은 source web, bridge.on은 source native.
      x-codegen-skip: true
      required: [type, version, source, event]
      properties:
        type: { const: event }
        version: { const: 1 }
        source: { type: string, enum: [web, native] }
        target: { type: string, enum: [native, web, broadcast] }
        event: { type: string }
        payload: {}

    # ── 오류 ─────────────────────────────────────────────────────────
    BridgeError:
      type: object
      description: 표준 오류. Native는 NATIVE_ERROR · UNSUPPORTED_VERSION만 보내고, 나머지는 Bridge Core가 만듭니다.
      required: [code, message, retryable]
      properties:
        code: { $ref: '#/components/schemas/BridgeErrorCode' }
        message: { type: string }
        retryable: { type: boolean, description: true면 Feature API가 자동 재시도할 수 있습니다 (읽기 요청만). }
        details: { $ref: '#/components/schemas/BridgeErrorDetails' }

    BridgeErrorCode:
      type: string
      description: |
        UNAVAILABLE 브릿지 없음 · SEND_FAILED 전송 실패 · TIMEOUT 응답 없음 · NATIVE_ERROR Native 처리 실패 ·
        INVALID_RESPONSE 잘못된 응답(기록만) · UNSUPPORTED_VERSION 앱이 지원하지 않음 · ABORTED 화면 이탈
      enum: [UNAVAILABLE, SEND_FAILED, TIMEOUT, NATIVE_ERROR, INVALID_RESPONSE, UNSUPPORTED_VERSION, ABORTED]

    BridgeErrorDetails:
      type: object
      required: [code]
      properties:
        code: { $ref: '#/components/schemas/NativeErrorCode' }

    NativeErrorCode:
      type: string
      description: |
        NATIVE_ERROR의 details.code. 앞의 넷은 Native Router가, 나머지는 Handler가 정합니다.
        METHOD_NOT_ALLOWED 화이트리스트 밖 method · INVALID_PARAMS 계약과 다른 params ·
        NOT_IMPLEMENTED Handler 없음 · INTERNAL 예상하지 못한 오류 · 그 밖은 operation의 x-native-errors
      x-extensible-enum: true
      enum: [METHOD_NOT_ALLOWED, INVALID_PARAMS, NOT_IMPLEMENTED, INTERNAL, PING_REJECTED]

    # ── operation params · result · payload ───────────────────────────
    EmptyPayload:
      type: object
      description: 빈 객체
      properties: {}

    PingParams:
      type: object
      required: [message]
      properties:
        message: { type: string, description: "보낼 문자열 (예: hello). 'reject'이면 ping이 PING_REJECTED로 실패" }

    PongResult:
      type: object
      required: [reply, platform]
      properties:
        reply: { type: string, description: "'pong: ' + 받은 message" }
        platform: { $ref: '#/components/schemas/Platform' }

    NativePingPayload:
      type: object
      required: [message, platform]
      properties:
        message: { type: string, description: Native가 보낸 문자열 }
        platform: { $ref: '#/components/schemas/Platform' }

    Platform:
      type: string
      enum: [ios, android]
